services:
  mediktest:
    image: medvedevs/medictest-parser:1.0.0
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      MEDIKTEST_HOST: 0.0.0.0
      MEDIKTEST_PORT: 8765
      MEDIKTEST_NO_BROWSER: "1"
      MEDIKTEST_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data